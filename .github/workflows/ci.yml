name: CI/CD

# Same chain as NextMES and SIGALES: test, then release (semantic-release), then build.
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

# Read-only token by default; release and build widen their own permissions.
permissions:
  contents: read

# A new push or title edit on a pull request cancels its run in progress: the new run tests the
# same head commit, so the required checks still report. Pushes to main and beta each get their
# own group (by commit), so no merge loses its image or its release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      # A pull request that only touches documentation skips test and e2e, which then report as
      # skipped (a pass for the required checks). The list is the whole pull request, not the last
      # push, so a later docs commit cannot hide an earlier code change. Pushes always run
      # everything. docs/catalog.example.yaml is read by tests, so it counts as code.
      - name: Is anything other than documentation changed?
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          echo "$files"
          code=false
          while read -r f; do
            case "$f" in
              docs/catalog.example.yaml) code=true ;;
              *.md | docs/* | .github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  pr-title:
    name: PR title (Conventional Commits)
    # Squash merges use the PR title as the commit message, which semantic-release reads.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The default types, plus `release` for the beta to main PR that closes a milestone (minor bump).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            release

  test:
    name: Lint, typecheck, tests, builds
    needs: changes
    # Runs unless the changes job said "docs only": if that job fails, the tests still run.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check that migrations match the schema
        run: |
          npm run db:generate --workspace backend
          git diff --exit-code -- backend/drizzle || { echo "Run 'npm run db:generate --workspace backend' and commit the migration."; exit 1; }
          test -z "$(git status --porcelain -- backend/drizzle)" || { git status --short -- backend/drizzle; exit 1; }

      - name: Check that the generated icon lists are committed
        run: node scripts/generate-icons.mjs --check

      - name: Tests (Docker target on libSQL, Workers target on D1)
        run: npm test

      - name: Build (frontend and Docker target)
        run: npm run build

      - name: Build Cloudflare Worker (dry run)
        run: npm run build:worker --workspace backend

  e2e:
    name: Accessibility and browser tests (Playwright)
    needs: changes
    # Runs unless the changes job said "docs only": if that job fails, the tests still run.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the browser tests
        run: npm run test:e2e --workspace frontend

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    needs: [test, e2e]
    # main releases on every push (a milestone promotion). beta publishes a prerelease only when
    # run by hand (Actions > CI/CD > Run workflow on beta): each merge into beta still builds the
    # `beta` and `sha-` images, without a tag or a GitHub release.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'))
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # semantic-release only creates the git tag and the GitHub release (notes = changelog):
    # no version commit, so main and beta can require pull requests with no bypass.
    # `released` tells a push that publishes a version from one without a releasable
    # commit (docs:, chore:): the immutable version tag is then not pushed again,
    # while latest/beta/sha still follow the branch.
    outputs:
      version: ${{ steps.sr.outputs.version }}
      released: ${{ steps.sr.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run semantic-release
        id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version_tag() { git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1; }
          before="$(version_tag)"
          npx semantic-release
          after="$(version_tag)"
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "Released: $after"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commit"
          fi

  build:
    name: Docker image
    runs-on: ubuntu-latest
    # After `release`, not in parallel: the image is labelled with the version that release
    # has just tagged. Does not rely on a tag push either: a tag created with GITHUB_TOKEN
    # triggers no workflow. Also after `e2e`: release is skipped on a merge into beta, so
    # without it the beta and sha- images would be pushed with failing browser tests.
    needs: [test, e2e, release]
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: >
      !cancelled()
      && needs.test.result == 'success'
      && needs.e2e.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to name non-release builds (e.g. 1.2.0-3-gabc1234).
          fetch-depth: 0

      - name: Application version
        id: version
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ "$RELEASED" = "true" ]; then v="$RELEASE_VERSION"; else v="$(git describe --tags --always)"; v="${v#v}"; fi
          echo "app=$v" >> "$GITHUB_OUTPUT"
          echo "Application version: $v"

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUSH == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/yasad
          tags: |
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,format=short

      - name: Build (and push on main/beta)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Pull requests only check that the image builds; arm64 under QEMU is slow.
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No provenance attestation: it publishes an OCI index whose children show up as
          # untagged versions in GHCR; deleting one breaks pulling the tag (MANIFEST_UNKNOWN).
          provenance: false
